[project]
name = "studperf"
version = "0.1.0"
description = "Permutação, bootstrap e jackknife aplicados ao Students Performance in Exams"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]